server:
  port: 8082

spring:
  application:
    name: sentinel-demo
  cloud:
    sentinel:
      eager: true
      transport:
        dashboard: 127.0.0.1:8858
        port: 8719
      web-context-unify: false
      filter:
        enabled: true

logging:
  level:
    com.alibaba.csp.sentinel: info
